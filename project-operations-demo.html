ar(--r);overflow:hidden}.panel-head,.toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.panel-head h2{font-size:17px;margin:0}.spacer{margin-left:auto}.toolbar{background:#f9fbfd}.search{min-width:240px;flex:1;max-width:390px}.search input,.field input,.field select{width:100%;border:1px solid #afbdcb;border-radius:7px;background:#fff;padding:8px 10px}.filter{border:1px solid #afbdcb;border-radius:7px;background:#fff;padding:8px 10px}.btn{border:1px solid #aebdca;background:#fff;border-radius:7px;padding:8px 12px;font-weight:650}.btn:hover{border-color:var(--blue);background:#f7fbff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue2)}.seg{display:flex;border:1px solid #afbdcb;border-radius:7px;overflow:hidden}.seg button{border:0;border-right:1px solid #afbdcb;background:#fff;padding:7px 12px}.seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:830px}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #e8edf2}th{background:#f7f9fb;color:#526476;font-size:12px;white-space:nowrap}tbody tr[data-id]{cursor:pointer}tbody tr[data-id]:hover{background:var(--pale)}.num{text-align:right;font-variant-numeric:tabular-nums}.status{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:750}.status.run{background:#e4f2eb;color:var(--ok)}.status.plan{background:#e8f1fb;color:var(--blue)}.status.wait{background:#fff2d7;color:var(--warn)}.empty{padding:54px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.calendar-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.calendar-head h2{margin:0 10px;font-size:18px;min-width:160px;text-align:center}.calendar{displ background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column}.drawer-head,.modal-head{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}.drawer-head h2,.modal-head h2{font-size:20px;margin:0}.icon-btn{margin-left:auto;border:0;background:transparent;font-size:25px;line-height:1;padding:4px 8px}.drawer-body{padding:20px;overflow:auto}.facts{display:grid;grid-template-columns:110px 1fr;gap:8px 15px;margin:0 0 20px}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:650}.cost-box{background:#f7f9fb;border:1px solid var(--line);border-radius:9px;padding:15px}.cost-box h3{margin:0 0 12px;font-size:16px}.cost-plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.cost-plan div{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px}.cost-plan span{display:block;color:var(--muted);font-size:11px}.cost-plan b{display:block;margin-top:3px}.cost-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.cost-result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.cost-result span{display:block;font-size:11px;color:var(--muted)}.cost-result b{font-size:16px}.delta.plus{color:var(--ok)}.delta.minus{color:var(--danger)}.drawer-actions{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.modal-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:18px}.modal{width:min(540px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:12px;box-shadow:var(--shadow)}.modal-body{padding:18px 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;background:#f7f9fb;border-top:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,15px);background:#12283b;color:#fff;border-radius:999px;padding:10px 20px;opacity:0;pointer-events:none;transition:.2s;z-index:150;box-shadow:var(--shadow);max-width:calc(100vw - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:980px){.summary{grid-template-columns:repeat(2,1fr)}.dest-grid{grid-template-columns:repeat(2,1fr)}}

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="brandmark">OPS</span><span>業務ポータル<br><small>PROJECT OPERATIONS</small></span></div>
    <nav class="nav" aria-label="主ナビゲーション">
      <button data-view="projects" aria-current="page">案件台帳</button>
      <button data-view="schedule">工程表</button>
      <button data-view="destinations">行先管理</button>
    </nav>
    <nav class="mobile-nav" aria-label="スマートフォン用ナビゲーション">
      <button data-view="projects" aria-current="page">案件</button><button data-view="schedule">工程</button><button data-view="destinations">行先</button>
    </nav>
    <div class="side-note">操作デモ v1.0<br>データはブラウザ内のみで保持</div>
  </aside>
  <section class="main-shell">
    <div class="demo-notice">操作デモ・表示内容はサンプル・再読み込みで初期状態に戻る・実装方式と項目は要件整理後に確定</div>
    <header class="topbar"><div><h1 id="pageTitle">案件台帳</h1><p id="pageSub">案件の状況・担当・収支を一覧で確認</p></div></header>
    <main class="content">
      <section class="view active" id="view-projects">
        <div class="summary"><div class="metric"><span>進行中</span><b id="metricRun">0件</b></div><div class="metric"><span>受注見込</span><b id="metricSales">¥0</b></div><div class="metric"><span>今月の予定工数</span><b>146時間</b></div><div class="metric"><span>要確認</span><b>1件</b></div></div>
        <div class="panel">
          <div class="panel-head"><h2>案件一覧</h2><span class="spacer" id="resultCount"></span></div>
          <div class="toolbar"><div class="search"><input id="projectSearch" type="search" placeholder="案件番号・案件名・担当で検索" aria-label="案件を検索"></div><select class="filter" id="statusFilter" aria-label="状態で絞り込み"><option value="all">すべての状態</option><option value="進行中">進行中</option><option value="計画中">計画中</option><option value="確認待ち">確認待ち</option></select></div>
          <div class="table-wrap"><table><thead><tr><th>案件番号</th><th>案件名</th><th>区分</th><th>担当</th><th>期間</th><th class="num">受注見込</th><th>状態</th></tr></thead><tbody id="projectRows"></tbody></table><div class="empty" id="projectEmpty" hidden><b>該当する案件がありません</b>検索語または絞り込み条件を変えてください。</div></div>
        </div>
      </section>
      <section class="view" id="view-schedule">
        <div class="panel">
          <div class="calendar-head"><button class="btn" id="calPrev" aria-label="前の期間">←</button><button class="btn" id="calToday">今週</button><h2 id="calTitle"></h2><div class="spacer"></div><div class="seg" aria-label="工程表の表示切替"><button data-mode="week" aria-pressed="true">週間</button><button data-mode="month" aria-pressed="false">月間</button></div></div>
          <div class="focus-strip" id="scheduleFocus" hidden></div><div id="calendarBody"></div>
        </div>
      </section>
      <section class="view" id="view-destinations">
        <div class="panel-head" style="padding-left:0;border:0"><h2>本日の行先</h2><span class="spacer" id="destinationDate"></span></div>
        <div class="dest-grid" id="destinationCards"></div>
      </section>
    </main>
  </section>
</div>

<div class="overlay" id="drawerOverlay" aria-hidden="true"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><div><small id="drawerNo"></small><h2 id="drawerTitle"></h2></div><button class="icon-btn" data-close="drawer" aria-label="詳細を閉じる">×</button></div><div class="drawer-body"><dl class="facts" id="drawerFacts"></dl><div class="cost-box"><h3>原価イメージ <small>（サンプル計算）</small></h3><div class="cost-plan"><div><span>予定工数</span><b id="planHours"></b></div><div><span>予定単価</span><b id="planRate"></b></div><div><span>予定外注費</span><b id="planOutsource"></b></div></div><div class="cost-inputs"><div class="field"><label for="actualHours">実績工数</label><input id="actualHours" type="number" min="0" step="0.5"></div><div class="field"><label for="actualRate">実績単価</label><input id="actualRate" type="number" min="0" step="100"></div><div class="field"><label for="actualOutsource">実績外注費</label><input id="actualOutsource" type="number" min="0" step="1000"></div></div><div class="cost-result"><div><span>見込原価</span><b id="estimateCost"></b></div><div><span>実績原価</span><b id="actualCost"></b></div><div><span>差額</span><b id="costDelta" class="delta"></b></div></div></div></div><div class="drawer-actions"><button class="btn" data-close="drawer">閉じる</button><button class="btn primary" id="goSchedule">この案件の工程表を見る</button></div></aside></div>

<div class="overlay" id="scheduleOverlay" aria-hidden="true"><div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="scheduleModalTitle"><div class="modal-head"><h2 id="scheduleModalTitle">予定を編集</h2><button class="icon-btn" data-close="schedule" aria-label="予定編集を閉じる">×</button></div><form id="scheduleForm"><div class="modal-body"><div class="form-grid"><div class="field wide"><label for="eventProject">案件</label><select id="eventProject"></select></div><div class="field wide"><label for="eventTitle">作業内容</label><input id="eventTitle" required maxlength="50"></div><div class="field"><label for="eventDate">日付</label><input id="eventDate" type="date" required></div><div class="field"><label for="eventAssignee">担当</label><select id="eventAssignee"><option>担当 A</option><option>担当 B</option><option>担当 C</option></select></div></div></div><div class="modal-actions"><button type="button" class="btn" data-close="schedule">キャンセル</button><button type="submit" class="btn primary">変更を保存</button></div></form></section></div></div>

<div class="overlay" id="destinationOverlay" aria-hidden="true"><div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="destinationModalTitle"><div class="modal-head"><h2 id="destinationModalTitle">行先を更新</h2><button class="icon-btn" data-close="destination" aria-label="行先更新を閉じる">×</button></div><form id="destinationForm"><div class="modal-body"><div class="form-grid"><div class="field wide"><label for="destMember">担当</label><input id="destMember" disabled></div><div class="field wide"><label for="destWhere">行先</label><input id="destWhere" required maxlength="40"></div><div class="field"><label for="destFrom">開始</label><input id="destFrom" type="time" required></div><div class="field"><label for="destTo">終了予定</label><input id="destTo" type="time" required></div><div class="field wide"><label for="destNote">連絡メモ</label><input id="destNote" maxlength="60"></div></div></div><div class="modal-actions"><button type="button" class="btn" data-close="destination">キャンセル</button><button type="submit" class="btn primary">行先を更新</button></div></form></section></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

];

function setView(view){state.view=view;$$('.view').forEach(function(v){v.classList.toggle('active',v.id==='view-'+view)});$$('[data-view]').forEach(function(b){if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});var copy={projects:["案件台帳","案件の状況・担当・収支を一覧で確認"],schedule:["工程表","週間・月間を同じ予定データから表示"],destinations:["行先管理","外出先からも更新しやすいカード表示"]}[view];$("#pageTitle").textContent=copy[0];$("#pageSub").textContent=copy[1];if(view==='schedule')renderCalendar();if(view==='destinations')renderDestinations();window.scrollTo(0,0)}
$$('[data-view]').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.view)})});
function renderProjects(){var q=$("#projectSearch").value.trim().toLowerCase(),st=$("#statusFilter").value;var list=projects.filter(function(p){return (st==='all'||p.status===st)&&[p.id,p.name,p.owner,p.type].join(' ').toLowerCase().indexOf(q)>=0});$("#projectRows").innerHTML=list.map(function(p){var cls=p.status==='進行中'?'run':p.status==='計画中'?'plan':'wait';return '<tr data-id="'+p.id+'" tabindex="0" aria-label="'+esc(p.name)+'の詳細を開く"><td><b>'+p.id+'</b></td><td>'+esc(p.name)+'</td><td>'+esc(p.type)+'</td><td>'+esc(p.owner)+'</td><td>'+jpDate(p.start)+'〜'+jpDate(p.end)+'</td><td class="num">'+yen(p.sales)+'</td><td><span class="status '+cls+'">'+p.status+'</span></td></tr>'}).join('');$("#projectEmpty").hidden=list.length!==0;$("#resultCount").textContent=list.length+"件";$("#metricRun").textContent=projects.filter(function(p){return p.status==='進行中'}).length+"件";$("#metricSales").textContent=yen(projects.reduce(function(a,p){return a+p.sales},0))}
$("#projectSearch").addEventListener('input',renderProjects);$("#statusFilter").addEventListener('change',renderProjects);$("#projectRows").addEventListener('click',function(e){var tr=e.target.closest('tr[data-id]');if(tr)openDrawer(tr.dataset.id)});$("#projectRows").addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-id]')){e.preventDefault();openDrawer(e.target.dataset.id)}});
function openLayer(id,focus){state.lastFocus=document.activeElement;var o=$(id);o.classList.add('open');o.setAttribute('aria-hidden','false');setTimeout(function(){(focus||o.querySelector('button,input,select')).focus()},20)}
function closeLayer(id){var o=$(id);o.classList.remove('open');o.setAttribute('aria-hidden','true');if(state.lastFocus)state.lastFocus.focus()}
function openDrawer(id){var p=project(id);state.project=id;$("#drawerNo").textContent=p.id;$("#drawerTitle").textContent=p.name;$("#drawerFacts").innerHTML='<dt>区分</dt><dd>'+esc(p.type)+'</dd><dt>担当</dt><dd>'+esc(p.owner)+'</dd><dt>期間</dt><dd>'+jpDate(p.start)+' 〜 '+jpDate(p.end)+'</dd><dt>受注見込</dt><dd>'+yen(p.sales)+'</dd><dt>状態</dt><dd>'+esc(p.status)+'</dd>';$("#planHours").textContent=p.planHours+'時間';$("#planRate").textContent=yen(p.planRate)+'/時';$("#planOutsource").textContent=yen(p.planOutsource);$("#actualHours").value=p.actualHours;$("#actualRate").value=p.actualRate;$("#actualOutsource").value=p.actualOutsource;calcCost();openLayer('#drawerOverlay',$("#actualHours"))}
function calcCost(){var p=project(state.project);if(!p)return;var h=Math.max(0,Number($("#actualHours").value)||0),r=Math.max(0,Number($("#actualRate").value)||0),o=Math.max(0,Number($("#actualOutsource").value)||0);p.actualHours=h;p.actualRate=r;p.actualOutsource=o;var est=p.planHours*p.planRate+p.planOutsource,actual=h*r+o,delta=est-actual;$("#estimateCost").textContent=yen(est);$("#actualCost").textContent=yen(actual);$("#costDelta").textContent=(delta>=0?'+':'−')+yen(Math.abs(delta));$("#costDelta").className='delta '+(delta>=0?'plus':'minus')}
['#actualHours','#actualRate','#actualOutsource'].forEach(function(id){$(id).addEventListener('input',calcCost)});$("#goSchedule").addEventListener('click',function(){var p=project(state.project);closeLayer('#drawerOverlay');state.mode='week';state.anchor=new Date(p.start+'T00:00:00');setModeButtons();setView('schedule');$("#scheduleFocus").hidden=false;$("#scheduleFocus").textContent=p.id+' '+p.name+' の期間へ移動しました';toast('案件の工程表へ移動しました')});
function startMonday(d){var x=new Date(d),day=x.getDay()||7;x.setDate(x.getDate()-day+1);x.setHours(0,0,0,0);return x}
function renderCalendar(){state.mode==='week'?renderWeek():renderMonth()}
function eventButton(ev){return '<button class="event" data-event="'+ev.id+'"><b>'+esc(ev.title)+'</b><br>'+esc(project(ev.project).name)+'</button>'}
function renderWeek(){var start=startMonday(state.anchor),days=[],names=['月','火','水','木','金','土','日'];for(var i=0;i<7;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}$("#calTitle").textContent=(start.getMonth()+1)+'月'+start.getDate()+'日 〜 '+(days[6].getMonth()+1)+'月'+days[6].getDate()+'日';var html='<div class="week"><div class="wh">担当</div>'+days.map(function(d,i){return '<div class="wh">'+names[i]+' '+(d.getMonth()+1)+'/'+d.getDate()+'</div>'}).join('');['担当 A','担当 B','担当 C'].forEach(function(person){html+='<div class="person">'+person+'</div>';days.forEach(function(d){var items=events.filter(function(e){return e.assignee===person&&e.date===iso(d)});html+='<div>'+items.map(eventButton).join('')+'</div>'})});$("#calendarBody").innerHTML=html+'</div>'}
function renderMonth(){var first=new Date(state.anchor.getFullYear(),state.anchor.getMonth(),1),grid=new Date(first),offset=(first.getDay()+6)%7;grid.setDate(grid.getDate()-offset);$("#calTitle").textContent=first.getFullYear()+'年 '+(first.getMonth()+1)+'月';var html='<div class="calendar">';for(var i=0;i<42;i++){var d=new Date(grid);d.setDate(grid.getDate()+i);var items=events.filter(function(e){return e.date===iso(d)});html+='<div class="day '+(d.getMonth()!==first.getMonth()?'muted':'')+'"><div class="day-head"><span>'+['月','火','水','木','金','土','日'][i%7]+'</span><span>'+d.getDate()+'</span></div>'+items.map(eventButton).join('')+'</div>'}$("#calendarBody").innerHTML=html+'</div>'}
function setModeButtons(){$$('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode))})}
$$('[data-mode]').forEach(function(b){b.addEventListener('click',function(){state.mode=b.dataset.mode;setModeButtons();renderCalendar()})});$("#calPrev").addEventListener('click',function(){if(state.mode==='week')state.anchor.setDate(state.anchor.getDate()-7);else{state.anchor.setDate(1);state.anchor.setMonth(state.anchor.getMonth()-1)}renderCalendar()});$("#calToday").addEventListener('click',function(){state.anchor=new Date(2026,8,14);renderCalendar();toast('デモ基準週へ戻りました')});$("#calendarBody").addEventListener('click',function(e){var b=e.target.closest('[data-event]');if(b)openSchedule(Number(b.dataset.event))});
function openSchedule(id){var ev=events.find(function(x){return x.id===id});state.event=id;$("#eventProject").innerHTML=projects.map(function(p){return '<option value="'+p.id+'">'+p.id+' '+esc(p.name)+'</option>'}).join('');$("#eventProject").value=ev.project;$("#eventTitle").value=ev.title;$("#eventDate").value=ev.date;$("#eventAssignee").value=ev.assignee;openLayer('#scheduleOverlay',$("#eventTitle"))}
$("#scheduleForm").addEventListener('submit',function(e){e.preventDefault();var ev=events.find(function(x){return x.id===state.event});ev.project=$("#eventProject").value;ev.title=$("#eventTitle").value.trim();ev.date=$("#eventDate").value;ev.assignee=$("#eventAssignee").value;closeLayer('#scheduleOverlay');renderCalendar();toast('予定を更新しました。週間・月間の両方に反映されます')});
function renderDestinations(){$("#destinationDate").textContent='2026年9月11日（金）';$("#destinationCards").innerHTML=destinations.map(function(d){return '<article class="phone-card"><div class="phone-top"><span class="avatar">'+esc(d.member.slice(-1))+'</span><div><b>'+esc(d.member)+'</b><br><small>'+esc(d.from)+' 〜 '+esc(d.to)+'</small></div></div><div class="phone-body"><small>現在の行先</small><div class="where">'+esc(d.where)+'</div><div class="detail-list"><span>予定</span><b>'+esc(d.from)+' 〜 '+esc(d.to)+'</b><span>連絡メモ</span><b>'+esc(d.note||'なし')+'</b></div><button class="btn primary" data-dest="'+d.id+'">行先を更新</button><div class="updated">最終更新 '+esc(d.updated)+'</div></div></article>'}).join('')}
$("#destinationCards").addEventListener('click',function(e){var b=e.target.closest('[data-dest]');if(!b)return;var d=destinations.find(function(x){return x.id===Number(b.dataset.dest)});state.destination=d.id;$("#destMember").value=d.member;$("#destWhere").value=d.where;$("#destFrom").value=d.from;$("#destTo").value=d.to;$("#destNote").value=d.note;openLayer('#destinationOverlay',$("#destWhere"))});$("#destinationForm").addEventListener('submit',function(e){e.preventDefault();var d=destinations.find(function(x){return x.id===state.destination});d.where=$("#destWhere").value.trim();d.from=$("#destFrom").value;d.to=$("#destTo").value;d.note=$("#destNote").value.trim();d.updated='たった今';closeLayer('#destinationOverlay');renderDestinations();toast(d.member+'の行先を更新しました')});
$$('[data-close]').forEach(function(b){b.addEventListener('click',function(){closeLayer('#'+b.dataset.close+'Overlay')})});$$('.overlay').forEach(function(o){o.addEventListener('mousedown',function(e){if(e.target===o)closeLayer('#'+o.id)})});document.addEventListener('keydown',function(e){if(e.key==='Escape'){var open=$('.overlay.open');if(open)closeLayer('#'+open.id)}});
/* 月送りで31日が翌月へ飛ぶ罠を避けるため、月間表示の基準日は必ず1日に戻してから進める。 */
var next=document.createElement('button');next.className='btn';next.id='calNext';next.textContent='→';next.setAttribute('aria-label','次の期間');$("#calTitle").after(next);next.addEventListener('click',function(){if(state.mode==='week')state.anchor.setDate(state.anchor.getDate()+7);else{state.anchor.setDate(1);state.anchor.setMonth(state.anchor.getMonth()+1)}renderCalendar()});
renderProjects();renderCalendar();renderDestinations();
})();
</script>
</body>
</html>
