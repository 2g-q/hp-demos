<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ドット絵プレビュー｜自動化のミナト</title>
<style>
:root{--black:#0D0D0D;--white:#FFFFFF;--charcoal:#343541;--gray:#8E8EA0;--blue:#2563EB}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--white);
 font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
 padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{margin:0;font-size:clamp(1.1rem,3vw,1.4rem);font-weight:600;letter-spacing:-.01em}
p{margin:0;color:var(--gray);font-size:.9rem;line-height:1.9;max-width:640px;text-align:center}
.frame{width:min(1280px,100%);aspect-ratio:1280/800;border:1px solid var(--white);
 border-radius:12px;overflow:hidden;background:var(--black)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
</style></head><body>
<h1>AIオフィス（検討中）</h1>
<div class="frame"><canvas id="scheme"></canvas></div>
<p>AI社員が働いている様子。文字も矢印も置かず、雰囲気だけの一枚絵です。</p>
<p>※仕組みの説明用に作った図です。実際の稼働状況を映すものではありません。</p>
<script src="./scheme-pixel.js"></script>
<script>window.mountSchemePixel(document.getElementById('scheme'));</script>
</body></html>
