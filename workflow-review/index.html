<body class="workflow-v3" data-workflow-page="home">
<main><header><img class="v3-home-wordmark" src="./assets/timeinc-wordmark.png" alt="timeInc."><div><h1>案件一覧</h1></div><button id="theme">ダーク</button></header>
<p>台帳で案件を確認し、週間の予定・実績を入力します。</p>
<label class="search">案件を探す<input id="search" type="search" placeholder="工番・正式名・略称で検索" autocomplete="off"></label>
<article id="case" hidden><div class="case-title"><h2 id="formal"></h2></div><dl><div><dt>工番</dt><dd id="identifier"></dd></div><div><dt>週間で使う名称</dt><dd id="alias"></dd></div><div><dt>入力する週</dt><dd>2026/3/23〜4/6</dd></div></dl>
<div class="buttons"><a id="open-ledger" class="button primary" aria-disabled="true">台帳を開く</a><a id="open-weekly" class="button" aria-disabled="true">週間の予定・実績へ</a></div>

<details class="save-scope"><summary>保存について</summary><p>入力はこのブラウザだけに保存されます。共有・Excelファイルの更新は行いません。実際の個人・案件情報は入力しないでください。ブラウザのデータを消去すると、保存した入力も消えます。</p></details></article>

<p id="empty" hidden>該当する案件はありません。</p><p id="home-status" role="status">Excelを確認中…</p></main></body></html>
