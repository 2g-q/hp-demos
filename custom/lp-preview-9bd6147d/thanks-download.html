<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>資料のご請求ありがとうございます｜仕訳無双</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--blue:#1d5ba6;--cyan:#12b5c9;--green:#17b978;
  --orange:#ff7a1a;--ink:#16202e;--sub:#5a6b80;--line:#e3e9f0;--bg2:#f4f8fc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.8;font-size:16px}
.wrap{width:100%;max-width:600px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(160deg,#0b2545,#13315c 60%,#1d5ba6);color:#fff;
  padding:56px 0 48px;text-align:center}
.mark{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.5);margin:0 auto 20px;display:flex;align-items:center;
  justify-content:center}
.hero h1{margin:0 0 12px;font-size:24px;font-weight:900;line-height:1.5}
.hero p{margin:0;font-size:15px;color:#dbe6f2;line-height:1.9}
section{padding:44px 0}
h2{font-size:19px;font-weight:800;margin:0 0 18px;line-height:1.5}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.list li{background:#fff;border:1px solid var(--line);border-left:4px solid var(--cyan);
  border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.7}
.cta{display:block;background:linear-gradient(135deg,#ff8a2b,#f2660b);color:#fff;
  text-decoration:none;text-align:center;font-weight:900;font-size:17px;line-height:1.45;
  padding:18px;border-radius:14px;box-shadow:0 8px 20px rgba(242,102,11,.3);margin-top:26px}
.cta small{display:block;font-size:12px;font-weight:700;opacity:.95;margin-top:4px}
.note{background:var(--bg2);border-radius:12px;padding:18px 16px;font-size:14px;color:var(--sub);
  line-height:1.8;margin-top:22px}
.back{display:block;text-align:center;margin:26px 0 0;font-size:15px;font-weight:800;
  color:var(--blue);text-decoration:none}
footer{background:#081b33;color:#9fb3c8;padding:24px 0 36px;font-size:12px;line-height:1.9}
@media (min-width:601px){body{font-size:17px}.hero h1{font-size:28px}}
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 19h16"/></svg>
    </div>
    <h1>資料のご請求<br>ありがとうございます</h1>
    <p>ご入力のメールアドレス宛に、料金・機能をまとめた資料をお送りします。</p>
  </div>
</div>

<section>
  <div class="wrap">
    <h2>資料に載っていること</h2>
    <ul class="list">
      <li>料金プランと、AI補助金を使った場合の実質負担</li>
      <li>AI仕訳から請求書発行までの機能一覧</li>
      <li>他社ツールとの比較（AI学習・ルール設定・引き継ぎ・連携）</li>
      <li>導入から運用開始までの流れ</li>
    </ul>

    <a class="cta" href="index.html#trial">実際の精度を試してみる<br>（無料トライアル）
      <small>証憑3枚〜・強引な営業は行いません</small></a>

    <p class="note">資料が届かない場合は、迷惑メールフォルダをご確認ください。<br>
      ご不明な点は、そのままご返信いただければお答えします。</p>
    <a class="back" href="index.html">← 仕訳無双のページに戻る</a>
  </div>
</section>

<footer>
  <div class="wrap">仕訳無双</div>
</footer>

</body>
</html>
