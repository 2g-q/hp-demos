<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>お申し込みありがとうございます｜仕訳無双</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--blue:#1d5ba6;--cyan:#12b5c9;--green:#17b978;
  --orange:#ff7a1a;--ink:#16202e;--sub:#5a6b80;--line:#e3e9f0;--bg2:#f4f8fc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.8;font-size:16px}
.wrap{width:100%;max-width:600px;margin:0 auto;padding:0 20px}
.hero{background:linear-gradient(160deg,#0b2545,#13315c 60%,#1d5ba6);color:#fff;
  padding:56px 0 48px;text-align:center}
.mark{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.5);margin:0 auto 20px;display:flex;align-items:center;
  justify-content:center}
.hero h1{margin:0 0 12px;font-size:24px;font-weight:900;line-height:1.5}
.hero p{margin:0;font-size:15px;color:#dbe6f2;line-height:1.9}
section{padding:44px 0}
h2{font-size:19px;font-weight:800;margin:0 0 18px;line-height:1.5}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:12px}
.steps li{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:16px 16px 16px 56px;position:relative;font-size:15px;line-height:1.7}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;
  width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;
  font-weight:900;display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-weight:800}
.note{background:var(--bg2);border-radius:12px;padding:18px 16px;font-size:14px;color:var(--sub);
  line-height:1.8;margin-top:22px}
.back{display:block;text-align:center;margin:30px 0 0;font-size:15px;font-weight:800;
  color:var(--blue);text-decoration:none}
footer{background:#081b33;color:#9fb3c8;padding:24px 0 36px;font-size:12px;line-height:1.9}
@media (min-width:601px){body{font-size:17px}.hero h1{font-size:28px}}
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
    </div>
    <h1>お申し込み<br>ありがとうございます</h1>
    <p>無料トライアルのお申し込みを受け付けました。<br>担当者より、ご入力のメールアドレス宛にご連絡いたします。</p>
  </div>
</div>

<section>
  <div class="wrap">
    <h2>このあとの流れ</h2>
    <ol class="steps">
      <li><b>担当者からご連絡</b>トライアルの進め方をご案内します。</li>
      <li><b>証憑データを3枚程度ご用意</b>実際のデータでAIの精度をお試しいただけます。</li>
      <li><b>結果のご確認</b>読み取り結果を一緒に確認し、ご不明な点にお答えします。</li>
    </ol>
    <p class="note">無料トライアルで、強引な営業は一切行いません。<br>
      自動返信メールが届かない場合は、迷惑メールフォルダをご確認ください。</p>
    <a class="back" href="index.html">← 仕訳無双のページに戻る</a>
  </div>
</section>

<footer>
  <div class="wrap">仕訳無双</div>
</footer>

</body>
</html>
